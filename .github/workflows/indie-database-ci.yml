name: Verify database

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync full upstream dataset
        run: npm run sync:data
      - name: Verify parser, data and build
        run: npm run verify
      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: chinese-indie-products-dist
          path: dist
