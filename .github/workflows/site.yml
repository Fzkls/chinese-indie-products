name: Verify and publish site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every Monday at 10:17 Asia/Shanghai (02:17 UTC).
    - cron: '17 2 * * 1'

permissions:
  contents: write

concurrency:
  group: "site-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Sync all upstream datasets
        run: npm run sync:data
      - name: Enrich direct GitHub repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SYNC_CONCURRENCY: 4
        run: npm run sync:github
      - name: Test, validate and build
        run: npm run verify
      - name: Commit refreshed data snapshot
        if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/tools.json data/quality-report.json data/github-repositories.json data/github-history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh source and GitHub snapshots"
          git push origin HEAD:main
      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: indiebase-cn-dist
          path: dist
      - name: Publish gh-pages branch
        if: github.event_name != 'pull_request'
        run: |
          SITE_DIR="$(mktemp -d)"
          cp -R dist/. "${SITE_DIR}/"
          touch "${SITE_DIR}/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clean -fdx
          git fetch origin gh-pages
          git switch --force-create gh-pages origin/gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${SITE_DIR}/." .
          git add --all
          git commit -m "deploy: publish ${GITHUB_SHA}" || true
          git push --force origin gh-pages
