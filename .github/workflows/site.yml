name: Verify and deploy site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pages_status: ${{ steps.pages.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Sync full upstream dataset
        run: npm run sync:data
      - name: Test, validate and build
        run: npm run verify
      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: chinese-indie-products-dist
          path: dist
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Explain disabled Pages
        if: github.event_name != 'pull_request' && steps.pages.outcome != 'success'
        run: echo "Build passed. Enable Settings > Pages > Source > GitHub Actions, then re-run this workflow to publish."
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && needs.verify.outputs.pages_status == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
