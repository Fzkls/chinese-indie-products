name: Verify and publish site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: "site-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Sync full upstream dataset
        run: npm run sync:data
      - name: Test, validate and build
        run: npm run verify
      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: chinese-indie-products-dist
          path: dist
      - name: Cancel stale workflow deployments
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for deployment in \
            7ce7b408fce08648dcbfe168fae8c0d15d407a4a \
            0d3745014eeb6e305850eff0d1fe8095b84257ca
          do
            curl --silent --show-error --location --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment}/cancel" || true
          done
      - name: Publish gh-pages branch
        if: github.event_name != 'pull_request'
        run: |
          SITE_DIR="$(mktemp -d)"
          cp -R dist/. "${SITE_DIR}/"
          touch "${SITE_DIR}/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi

          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${SITE_DIR}/." .
          git add --all
          git commit -m "deploy: publish ${GITHUB_SHA}"
          git push --force origin gh-pages
      - name: Configure Pages to publish gh-pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --location --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
