name: Sync upstream database

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Sync upstream records
        run: npm run sync:data
      - name: Verify generated database
        run: npm run verify
      - name: Create data update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/upstream-data-sync
          delete-branch: true
          commit-message: 'data: sync independent developer products'
          title: 'data: sync independent developer products'
          body: |
            Automated refresh from `1c7/chinese-independent-developer`.

            - Rebuilt `data/products.json`
            - Rebuilt `data/quality-report.json`
            - Ran parser tests, data validation and static build
          add-paths: |
            data/products.json
            data/quality-report.json
