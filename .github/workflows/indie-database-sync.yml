name: Create data sync pull request

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Sync upstream records
        run: npm run sync:data
      - name: Build semantic taxonomy
        run: npm run sync:taxonomy
      - name: Enrich direct GitHub repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SYNC_CONCURRENCY: 4
        run: npm run sync:github
      - name: Verify generated database
        run: npm run verify
      - name: Create data update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/upstream-data-sync
          delete-branch: true
          commit-message: 'data: sync independent developer products, taxonomy and GitHub metadata'
          title: 'data: sync independent developer products, taxonomy and GitHub metadata'
          body: |
            Automated refresh of the product, taxonomy, tool and GitHub enrichment datasets.

            - Rebuilt `data/products.json` and `data/tools.json`
            - Rebuilt `data/quality-report.json`
            - Rebuilt `data/product-taxonomy.json` from taxonomy v1
            - Refreshed `data/github-repositories.json`
            - Appended compact weekly snapshots to `data/github-history.json`
            - Ran parser/taxonomy tests, data validation and static build
          add-paths: |
            data/products.json
            data/tools.json
            data/quality-report.json
            data/product-taxonomy.json
            data/github-repositories.json
            data/github-history.json
