name: Refresh daily GitHub snapshot

on:
  workflow_dispatch:
  schedule:
    # Every day at 09:17 Asia/Shanghai (01:17 UTC).
    - cron: '17 1 * * *'

permissions:
  contents: write

concurrency:
  group: "github-daily-snapshot"
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Refresh GitHub snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SYNC_CONCURRENCY: 4
        run: npm run sync:github
      - name: Test and build
        run: npm run test && npm run check:js && npm run check:data && npm run build
      - name: Commit daily GitHub snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-repositories.json data/github-history.json
          if git diff --cached --quiet; then
            echo "No GitHub snapshot changes to commit."
            exit 0
          fi
          git commit -m "data: refresh daily GitHub snapshot"
          git push origin HEAD:main
      - name: Publish gh-pages branch
        run: |
          SITE_DIR="$(mktemp -d)"
          cp -R dist/. "${SITE_DIR}/"
          touch "${SITE_DIR}/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clean -fdx
          git fetch origin gh-pages
          git switch --force-create gh-pages origin/gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "${SITE_DIR}/." .
          git add --all
          git commit -m "deploy: publish daily GitHub snapshot" || true
          git push --force origin gh-pages
